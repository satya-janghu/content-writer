[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    slow: tests that take >10s (GPU model load, etc.)
    daemon: tests that require the eval_server daemon to be running
    race: concurrent-writer / race-condition tests
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:transformers.*
    ignore::FutureWarning:sklearn.*
